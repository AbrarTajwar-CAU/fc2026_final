name: Build FC2026 Production APK

on:
  workflow_dispatch: # Single-click manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out code repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup stable Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Automatically deploy Android SDK and force accept all modern NDK licenses
      - name: Setup Android SDK and Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'

      # 4. Deploy official Flutter Framework
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. Download package dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 6. Compile release binaries directly
      - name: Compile Release APK
        run: flutter build apk --release

      # 7. Package and output the completed distribution installer
      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FC2026_Production_Build
          path: build/app/outputs/flutter-apk/app-release.apk